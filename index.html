<!DOCTYPE html>
<html class="scroll-smooth" lang="vi">

<head>
  <!-- ============================================================
       <head> da toi uu (Quick wins)
       - Meta SEO + Open Graph + Twitter Card
       - Favicon gom nhom (loai bo .ico khong ton tai)
       - Subset Google Fonts (giam ~60-70% weight)
       - Preload anh LCP hero + font critical
       - defer script.js + section-loader.js (non-blocking)
       - Tailwind CDN: giu nguyen theo yeu cau nguoi dung
       ============================================================ -->
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="theme-color" content="#FFFBF5">

  <!-- SEO co ban -->
  <title>Hoàng Thanh Khánh — Lập trình viên Fullstack & Kỹ sư phần mềm</title>
  <meta name="description"
    content="Portfolio cá nhân của Hoàng Thanh Khánh — Lập trình viên Fullstack, sinh viên năm 3 chuyên ngành Tin học ứng dụng. Chia sẻ dự án, kinh nghiệm và tech stack (React, Next.js, PHP, Python, SQL).">
  <meta name="keywords"
    content="Hoàng Thanh Khánh, Khanhht, Fullstack Developer, Portfolio, Lập trình viên, React, Next.js, PHP, Python, MySQL">
  <meta name="author" content="Hoàng Thanh Khánh">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hoàng Thanh Khánh — Lập trình viên Fullstack">
  <meta property="og:description"
    content="Portfolio cá nhân — dự án, kinh nghiệm và tech stack của một lập trình viên Fullstack tại Việt Nam.">
  <meta property="og:url" content="">
  <meta property="og:image" content="image/remove.png">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Khanhht Portfolio">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hoàng Thanh Khánh — Lập trình viên Fullstack">
  <meta name="twitter:description"
    content="Portfolio cá nhân — dự án, kinh nghiệm và tech stack của một lập trình viên Fullstack.">
  <meta name="twitter:image" content="image/remove.png">

  <!-- Favicon (gom nhom, bo file .ico khong ton tai) -->
  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="image/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="image/android-chrome-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="image/android-chrome-512.png">

  <!-- Preconnect font + preload font critical -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Hanken+Grotesk:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Hanken+Grotesk:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <!--
    LUU Y: KHONG preload <link rel="preload" as="image"> cho image/remove.png o day.
    Ly do: section #hero duoc section-loader.js inject SAU khi DOM ready,
    nen Chrome se bao loi "preloaded but not used within a few seconds".
    section-loader.js se tu dong preload + inject anh hero ngay khi fetch xong
    (xem section-loader.js → fetchSection).
  -->

  <!-- Critical inline style (giu de khong phu thuoc Tailwind CDN load cham) -->
  <style>
    h1,
    h2,
    h3,
    h4,
    .font-display {
      font-family: 'Hanken Grotesk', 'Inter', sans-serif !important;
    }
    /* An body cho den khi font san sang (anti-FOUC) */
    html.fonts-loading body {
      visibility: hidden;
    }
    /* Placeholder section: giu chieu cao toi thieu de tranh layout shift */
    [data-section] {
      min-height: 0;
    }
    [data-section]:empty {
      /* Section chua load → khong hien thi nham noi dung */
      display: contents;
    }
    /* ============================================
       ANIMATE.CSS BOOT — an cac element co class
       animate__animated cho den khi JS add class
       animate__triggered (tranh FOUC khi reveal).
       ============================================ */
    html:not(.animate-ready) .animate-booted {
      opacity: 0 !important;
    }
  </style>

  <!-- ============================================================
       ANIMATION LIBRARY — Animate.css (CDN, vanilla)
       - Them hieu ung animate.css (fade, slide, bounce, zoom, ...)
       - Tuong thich prefers-reduced-motion san (an toan a11y)
       - 71KB gzip ~110KB; CDN cache tot trong trinh duyet
       Chi dung class .animate-booted de gan animate.css utilities
       (khong xung dot voi .reveal-on-scroll hien co).
       ============================================================ -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Tailwind CSS CDN (JIT runtime - giu theo yeu cau nguoi dung) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: {
              bg: '#FFFBF5',
              surface: '#FFF8F0',
              white: '#FFFFFF',
              border: '#E7E5E4',
              'border-subtle': '#F5F0EB',
              muted: '#78716C',
              body: '#44403C',
              dark: '#292524',
            },
            brand: {
              blue: '#007BFF',
              'blue-hover': '#0056CC',
              'blue-light': '#DBEAFE',
              amber: '#F59E0B',
              'amber-light': '#FEF3C7',
              coral: '#F97316',
              success: '#10B981',
              danger: '#EF4444',
              info: '#38BDF8',
            }
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '"Hanken Grotesk"', 'sans-serif'],
            display: ['"Hanken Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          maxWidth: { 'site': '1280px' },
          borderRadius: { sm: '4px', md: '8px', lg: '12px' }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="about.css?v=20260929">
  <link rel="stylesheet" href="experience.css?v=20260929-2">
  <link rel="stylesheet" href="section-headings.css?v=20260929">
  <link rel="stylesheet" href="testimonials.css?v=20260929">

  <!-- Font ready: go bo anti-FOUC -->
  <script>
    document.fonts.ready.then(() => {
      document.documentElement.classList.remove('fonts-loading');
    });
    window.addEventListener('load', () => {
      setTimeout(() => document.documentElement.classList.remove('fonts-loading'), 500);
    });
  </script>
</head>

<!--
  ============================================================
   MY-PORTFOLIO — index.html: skeleton tham chiếu các section
  ------------------------------------------------------------
   index.html         : file này (skeleton, không chứa nội dung section)
   style.css          : CSS tùy chỉnh
   script.js          : logic JS chính (đợi section inject xong mới chạy)
   section-loader.js  : loader runtime — fetch & inject sections/*.html
   sections/          : HTML fragment của từng section, load qua fetch()
       00-scroll-progress.html  -> vạch tiến trình cuộn (đặt tĩnh trong <body>)
       01-navbar.html           -> header sticky + nav chính + mobile menu
       02-hero.html             -> banner giới thiệu chính
       03-work.html             -> danh sách 3 dự án tiêu biểu
       04-about.html            -> giới thiệu + slider chân dung autoplay
       05-experience.html       -> timeline kinh nghiệm + bằng cấp
       06-capabilities.html     -> tech stack (2 marquee rows)
       07-contact.html          -> CTA liên hệ + email/github/facebook
       08-footer.html           -> footer
  ------------------------------------------------------------
   Luồng hoạt động:
     1. Browser tải index.html (rất nhẹ, ~5-6 KB)
     2. section-loader.js (defer) fetch song song 3 section above-the-fold:
        00, 01, 02 → inject vào các placeholder tương ứng
     3. Khi 3 section trên load xong → phát event "sections:loaded"
     4. script.js (defer) bind events cho navbar, hero, slider, ...
     5. requestIdleCallback → load các section còn lại (03-08) trong nền
     6. Khi section mới được inject → MutationObserver re-bind reveal observer
  ============================================================
-->

<body class="bg-[#FFFBF5] text-[#292524] font-sans antialiased selection:bg-[#007BFF] selection:text-white relative">

  <!-- 00. SCROLL PROGRESS (đặt tĩnh để khỏi FOUC) -->
  <div aria-hidden="true" id="scroll-progress"></div>

  <!-- 01. NAVBAR -->
  <div data-section="01-navbar"></div>

  <main>
    <!-- 02. HERO -->
    <div data-section="02-hero"></div>

    <!-- 03. SELECTED WORK -->
    <div data-section="03-work"></div>

    <!-- 04. ABOUT -->
    <div data-section="04-about"></div>

    <!-- 05. EXPERIENCE -->
    <div data-section="05-experience"></div>

    <!-- 06. TECH STACK -->
    <div data-section="06-capabilities"></div>

    <!-- 09. TESTIMONIALS -->
    <div data-section="09-testimonials"></div>

    <!-- 07. CONTACT -->
    <div data-section="07-contact"></div>
  </main>

  <!-- 08. FOOTER -->
  <div data-section="08-footer"></div>

  <!-- Section loader (load trước, không cần đợi section xong) -->
  <script src="section-loader.js" defer></script>

  <!-- DEV-ONLY: auto-reload khi sửa file. XÓA dòng này khi deploy production. -->
  <script src="auto-reload.js" defer></script>

  <!-- Main app script (chờ event "sections:loaded" mới init) -->
  <script src="script.js" defer></script>
</body>

</html>
