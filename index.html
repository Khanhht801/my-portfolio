<!doctype html>
<html class="scroll-smooth" lang="vi">
  <head>
    <!-- ============================================================
       <head> da toi uu (Quick wins)
       - Meta SEO + Open Graph + Twitter Card
       - Favicon gom nhom (loai bo .ico khong ton tai)
       - Subset Google Fonts (giam ~60-70% weight)
       - Preload anh LCP hero + font critical
       - React entry duoc tai duoi dang module
       - Tailwind CSS duoc build san cho production
       ============================================================ -->
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="theme-color" content="#FFFBF5" />

    <!-- SEO co ban -->
    <title>Hoàng Thanh Khánh | Lập trình viên Fullstack</title>
    <meta
      name="description"
      content="Khám phá portfolio của Hoàng Thanh Khánh: các dự án web, kinh nghiệm quản lý website và kỹ năng phát triển Fullstack với React, Next.js, PHP và Python."
    />
    <meta
      name="keywords"
      content="Hoàng Thanh Khánh, Khanhht, Fullstack Developer, Portfolio, Lập trình viên, React, Next.js, PHP, Python, MySQL"
    />
    <meta name="author" content="Hoàng Thanh Khánh" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph and Twitter metadata are generated by scripts/technical-seo.mjs
         from this page's title/description and the confirmed CNAME. -->

    <!-- Favicon (gom nhom, bo file .ico khong ton tai) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="image/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="image/favicon-64.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="image/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="image/android-chrome-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="image/android-chrome-512.png"
    />

    <!-- Preconnect font + preload font critical -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Hanken+Grotesk:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Hanken+Grotesk:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Critical inline style -->
    <style>
      h1,
      h2,
      h3,
      h4,
      .font-display {
        font-family: "Hanken Grotesk", "Inter", sans-serif !important;
      }
      /* An body cho den khi font san sang (anti-FOUC) */
      html.fonts-loading body {
        visibility: hidden;
      }
      /* Placeholder section: giu chieu cao toi thieu de tranh layout shift */
      [data-section] {
        min-height: 0;
      }
      [data-section]:empty {
        /* Section chua load → khong hien thi nham noi dung */
        display: contents;
      }
    </style>

    <!-- Compiled Tailwind + custom CSS -->
    <link rel="stylesheet" href="tailwind.css?v=20261001-1" />
    <link rel="stylesheet" href="style.css?v=20261031-1" />
    <link rel="stylesheet" href="about.css?v=20261030-1" />
    <link rel="stylesheet" href="experience.css?v=20261030-1" />
    <link rel="stylesheet" href="section-headings.css?v=20260929-3" />
    <link rel="stylesheet" href="testimonials.css?v=20261030-1" />

    <!-- Font ready: go bo anti-FOUC -->
    <script>
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove("fonts-loading");
      });
      window.addEventListener("load", () => {
        setTimeout(
          () => document.documentElement.classList.remove("fonts-loading"),
          500,
        );
      });
    </script>
  </head>

  <body class="bg-[#FFFBF5] text-[#292524] font-sans antialiased selection:bg-[#007BFF] selection:text-white relative">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
