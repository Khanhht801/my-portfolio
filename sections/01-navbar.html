<!-- ============================================================
     01. NAVBAR
     - Sticky header với logo, navigation, GitHub link, Contact me
     - Mobile dropdown menu
     - Selector JS phụ thuộc:
         + #main-header (header shadow on scroll)
         + #scroll-progress (đặt ở body, không nằm trong section này)
         + #mobile-toggle, #mobile-menu (mobile menu toggle)
============================================================ -->
<header
  class="sticky top-0 z-50 bg-[#FFFBF5]/80 backdrop-blur-xl border-b border-[#E7E5E4]/60 transition-all duration-200 shadow-sm"
  id="main-header">
  <div class="max-w-site mx-auto px-4 sm:px-6 h-16 lg:h-20 flex items-center justify-end relative gap-4">
    <!-- Left: Brand / Logo -->
    <a aria-label="Khanhht - Trang chủ" class="absolute left-4 sm:left-6 flex items-center gap-2 group z-10"
      href="#hero">
      <img src="image/logo.jpg" alt="Khanhht Logo" width="36" height="36"
        class="w-9 h-9 rounded-full object-cover border-2 border-[#007BFF] group-hover:scale-110 transition-transform shadow-sm">
      <span
        class="font-display font-bold tracking-tight text-[#292524] group-hover:text-[#007BFF] transition-colors">Khanhht</span>
    </a>

    <!-- Center: Center Navigation Bar -->
    <nav aria-label="Main Navigation"
      class="hidden lg:flex items-center gap-2 text-base font-medium text-[#292524] absolute left-1/2 -translate-x-1/2 normal-case">
      <a class="px-4 py-2 rounded-xl hover:text-[#007BFF] hover:bg-[#DBEAFE]/60 transition-all duration-150 text-base font-medium"
        href="#work">Dự án</a>
      <a class="px-4 py-2 rounded-xl hover:text-[#007BFF] hover:bg-[#DBEAFE]/60 transition-all duration-150 text-base font-medium"
        href="#about">Giới thiệu</a>
      <a class="px-4 py-2 rounded-xl hover:text-[#007BFF] hover:bg-[#DBEAFE]/60 transition-all duration-150 text-base font-medium"
        href="#experience">Kinh nghiệm</a>
      <a class="px-4 py-2 rounded-xl hover:text-[#007BFF] hover:bg-[#DBEAFE]/60 transition-all duration-150 text-base font-medium"
        href="#capabilities">Kỹ năng</a>
      <a class="px-4 py-2 rounded-xl hover:text-[#007BFF] hover:bg-[#DBEAFE]/60 transition-all duration-150 text-base font-medium"
        href="#contact">Liên hệ</a>
    </nav>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2.5 sm:gap-3 z-10">
      <a aria-label="GitHub Profile"
        class="hidden md:inline-flex items-center justify-center w-9 h-9 rounded-xl border border-[#E7E5E4] bg-white/70 backdrop-blur-sm text-[#292524] hover:text-[#007BFF] hover:border-[#007BFF] transition-all hover:scale-105 shadow-sm"
        href="https://github.com/Khanhht801" rel="noopener noreferrer" target="_blank">
        <svg class="w-4 h-4 fill-currentColor transition-transform" viewBox="0 0 24 24">
          <path clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
            fill-rule="evenodd"></path>
        </svg>
      </a>
      <a class="btn-shimmer inline-flex min-h-11 items-center gap-2 text-sm font-sans font-semibold px-5 py-2.5 rounded-full bg-[#007BFF] text-white hover:bg-[#0056CC] shadow-md shadow-blue-500/20 hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#007BFF] group"
        href="#contact">
        <span>CONTACT ME</span>
        <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path d="M5 12h14m-5-5 5 5-5 5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </a>
      <button aria-label="Toggle navigation menu"
        class="p-1.5 text-[#292524] hover:text-[#007BFF] focus:outline-none lg:hidden border border-[#E7E5E4] rounded-xl bg-white/70 backdrop-blur-sm"
        id="mobile-toggle" type="button">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <div
    class="hidden lg:hidden bg-white/90 backdrop-blur-xl border-b border-[#E7E5E4] px-6 py-4 transition-all shadow-sm rounded-b-2xl"
    id="mobile-menu">
    <div class="flex flex-col space-y-3 font-medium text-sm normal-case">
      <a class="py-1 text-[#292524] hover:text-[#007BFF]" href="#work">Dự án</a>
      <a class="py-1 text-[#292524] hover:text-[#007BFF]" href="#about">Giới thiệu</a>
      <a class="py-1 text-[#292524] hover:text-[#007BFF]" href="#experience">Kinh nghiệm</a>
      <a class="py-1 text-[#292524] hover:text-[#007BFF]" href="#capabilities">Kỹ năng</a>
      <a class="py-1 text-[#292524] hover:text-[#007BFF]" href="#contact">Liên hệ</a>
      <div class="pt-2 border-t border-[#E7E5E4] flex items-center justify-end">
        <a class="inline-flex min-h-11 items-center gap-2 text-sm font-sans font-semibold px-5 py-2.5 rounded-full bg-[#007BFF] text-white hover:bg-[#0056CC] shadow-sm transition-all focus:ring-2 focus:ring-[#007BFF]"
          href="#contact">
          Contact me →
        </a>
      </div>
    </div>
  </div>
</header>
